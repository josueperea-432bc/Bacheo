services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sistema_baches_frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistema_baches_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USERNAME: baches
      DB_PASSWORD: baches123
      DB_DATABASE: sistema_baches
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: sistema_baches_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_baches
      MYSQL_USER: baches
      MYSQL_PASSWORD: baches123
    ports:
      - "3308:3306"
    volumes:
      - baches_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sistema_baches_pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: baches
      PMA_PASSWORD: baches123
    ports:
      - "8082:80"

volumes:
  baches_db_data:
